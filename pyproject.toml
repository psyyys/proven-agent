[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proven"
version = "0.1.0"
description = "A traceable data-analysis agent: every number in the report is backed by code that actually ran."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "duckdb>=1.0",
  "plotly>=5.20",
  "openpyxl>=3.1",
  "jupyter_client>=8.6",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "jieba>=0.42",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
proven = "proven.cli:main"

[tool.setuptools.packages.find]
include = ["proven*"]

[tool.setuptools.package-data]
"proven.packs" = ["**/*.yaml", "**/*.md", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
