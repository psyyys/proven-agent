questions:
  - id: w01
    type: basic
    dataset: camels_attributes
    question: 671 个流域的平均径流系数是多少？
    answer_code: answer = round(camels_attributes.runoff_ratio.mean(), 3)
    tol: 0.005

  - id: w02
    type: basic
    dataset: camels_attributes
    question: 流域面积（area_gages2）最大的流域面积是多少平方公里？
    answer_code: answer = round(camels_attributes.area_gages2.max(), 2)

  - id: w03
    type: aggregate
    dataset: camels_attributes
    question: 干旱指数大于 1 的流域有多少个？
    answer_code: answer = int((camels_attributes.aridity > 1).sum())

  - id: w04
    type: aggregate
    dataset: camels_attributes
    question: 干旱指数与径流系数的 Pearson 相关系数是多少？
    answer_code: answer = round(camels_attributes[["aridity", "runoff_ratio"]].corr().iloc[0, 1], 3)
    tol: 0.01

  - id: w05
    type: multistep
    dataset: camels_daily
    question: 01022500 流域 2001 年的年径流深是多少毫米？
    answer_code: |
      area = camels_attributes.set_index("gauge_id").loc["01022500", "area_gages2"]
      d = camels_daily[(camels_daily.gauge_id == "01022500") & (pd.to_datetime(camels_daily.date).dt.year == 2001)]
      answer = round(float(cfs_to_mm_per_day(d.q_cfs, area).sum()), 1)
    tol: 0.01

  - id: w06
    type: multistep
    dataset: camels_daily
    question: 01022500 流域 2001 年的径流系数是多少？
    answer_code: |
      area = camels_attributes.set_index("gauge_id").loc["01022500", "area_gages2"]
      d = camels_daily[(camels_daily.gauge_id == "01022500") & (pd.to_datetime(camels_daily.date).dt.year == 2001)]
      answer = round(float(cfs_to_mm_per_day(d.q_cfs, area).sum() / d.prcp_mm.sum()), 3)
    tol: 0.01

  - id: w07
    type: aggregate
    dataset: camels_daily
    question: 4 个流域中，2000-2002 年最大日流量（cfs）出现在哪个流域？是多少？
    answer_code: answer = float(camels_daily.q_cfs.max())

  - id: w08
    type: domain
    dataset: usgs_peaks
    question: 01594440 站按 USGS 水文年的年最大洪峰序列有多少年？均值是多少 cfs？
    answer_code: |
      am = annual_maxima(usgs_peaks_01594440, "peak_date", "peak_cfs", 10)
      answer = [len(am), round(am.annual_max.mean(), 1)]

  - id: w09
    type: domain
    dataset: usgs_peaks
    question: 用矩法估计 01594440 站年最大洪峰（水文年）的 P-III 参数，Cv 和 Cs 分别是多少？
    answer_code: |
      f = p3_fit(annual_maxima(usgs_peaks_01594440, "peak_date", "peak_cfs", 10).annual_max)
      answer = [round(f.cv, 3), round(f.cs, 3)]
    tol: 0.01

  - id: w10
    type: domain
    dataset: usgs_peaks
    question: 01594440 站 100 年一遇设计洪峰是多少 cfs？（P-III，矩法参数，水文年选样）
    answer_code: |
      f = p3_fit(annual_maxima(usgs_peaks_01594440, "peak_date", "peak_cfs", 10).annual_max)
      answer = round(float(p3_design_values(f, (100,)).design_value.iloc[0]), 0)
    tol: 0.01

  - id: w11
    type: trap
    dataset: camels_attributes
    question: 这些流域 2020 年的水库蓄水量变化是多少？
    expect: refuse

  - id: w12
    type: rag
    dataset: usgs_peaks
    question: 样本只有 20 年时，推求百年一遇洪水有什么风险？规范上一般怎么处理 Cs？
    expect: doc
