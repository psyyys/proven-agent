datasets:
  camels:
    description: CAMELS 美国大样本流域数据集。属性表每行一个流域；逐日表每行一个流域一天。
    tables:
      camels_attributes:
        description: 671 个流域的静态属性（地形、气候、水文特征、土壤、植被、地质），气候与水文指标基于 1989-2009 年计算
        primary_key: gauge_id
        columns:
          gauge_id: USGS 站点编号（8 位字符串，保留前导零）
          gauge_name: 站点名称
          huc_02: 所属二级水文单元（HUC-02）编号
          gauge_lat: 站点纬度
          gauge_lon: 站点经度
          elev_mean: 流域平均高程（m）
          slope_mean: 流域平均坡度（m/km）
          area_gages2: 流域面积（km²，GAGES-II 数据，推荐用于计算）
          area_geospa_fabric: 流域面积（km²，Geospatial Fabric 数据）
          p_mean: 多年平均日降水量（mm/d）
          pet_mean: 多年平均日潜在蒸散发（mm/d）
          aridity: 干旱指数 = PET / P，大于 1 表示水分受限
          p_seasonality: 降水季节性，正值表示夏季降水为主，负值表示冬季为主
          frac_snow: 降雪占总降水的比例
          high_prec_freq: 强降水日频率（日降水 ≥ 5 倍多年平均日降水，天/年）
          high_prec_dur: 强降水事件平均持续天数
          low_prec_freq: 干日频率（日降水 < 1 mm，天/年）
          low_prec_dur: 干期平均持续天数
          q_mean: 多年平均日径流深（mm/d）
          runoff_ratio: 径流系数 = q_mean / p_mean
          baseflow_index: 基流指数 = 基流量 / 总径流量（数字滤波法分割）
          stream_elas: 径流对降水的弹性系数
          slope_fdc: 流量历时曲线在 33%-66% 分位之间的斜率
          q5: 5% 分位流量（枯水流量，mm/d）
          q95: 95% 分位流量（高流量，mm/d）
          high_q_freq: 高流量日频率（日流量 > 9 倍中位数流量，天/年）
          high_q_dur: 高流量事件平均持续天数
          low_q_freq: 低流量日频率（日流量 < 0.2 倍平均流量，天/年）
          low_q_dur: 低流量事件平均持续天数
          zero_q_freq: 零流量日所占比例
          hfd_mean: 平均半流量日期（水文年内累计径流达到一半的日序数，自 10 月 1 日起）
          frac_forest: 森林覆盖率
          soil_depth_pelletier: 土壤厚度（m，Pelletier 数据）
          soil_porosity: 土壤孔隙度
          soil_conductivity: 土壤饱和导水率（cm/h）
          carbonate_rocks_frac: 碳酸盐岩占比
          geol_permeability: 地质渗透率（log10 m²）
      camels_daily:
        description: 4 个流域 2000-2002 年逐日流量与 Daymet 流域平均气象
        columns:
          gauge_id: USGS 站点编号（字符串）
          date: 日期
          q_cfs: 日平均流量（立方英尺/秒，cfs）；1 cfs = 0.0283168 m³/s
          q_flag: USGS 数据质量标记（A 已审核，A:e 估算值）
          prcp_mm: 流域平均日降水（mm）
          tmax_c: 日最高气温（°C）
          tmin_c: 日最低气温（°C）
          srad_wm2: 日平均短波辐射（W/m²）
          swe_mm: 雪水当量（mm）
          vp_pa: 水汽压（Pa）
    relationships:
      - camels_daily.gauge_id -> camels_attributes.gauge_id
    metrics:
      - name: 径流深
        aliases: [年径流深, runoff depth]
        definition: 一定时段内径流量平铺在流域面积上的水深（mm）
        formula: 日径流深(mm) = q_cfs × 0.0283168 × 86400 / (area_gages2 × 10^6) × 1000；年径流深为日径流深之和。可用 cfs_to_mm_per_day(q_cfs, area_km2)
      - name: 径流系数
        aliases: [runoff ratio]
        definition: 同期径流深与降水量之比
        formula: 径流深之和 / 降水量之和（同一时段、同一流域）
        notes: 属性表中的 runoff_ratio 基于 1989-2009 年；用逐日数据计算的是所选时段的径流系数，两者不必相等
      - name: 干旱指数
        aliases: [aridity]
        definition: 潜在蒸散发与降水之比
        formula: pet_mean / p_mean（属性表 aridity 字段）
  usgs_peaks:
    description: USGS 年最大洪峰流量序列
    tables:
      usgs_peaks_01594440:
        description: 01594440 站（Patuxent River near Bowie, MD）年最大洪峰，2000-2018，每个 USGS 水文年一条记录
        columns:
          site_no: 站点编号
          peak_date: 洪峰出现日期
          peak_cfs: 洪峰流量（cfs）
          gage_height_ft: 洪峰对应水位（英尺）
          peak_code: USGS 洪峰资料代码（如 5 表示受调节或分洪影响，2 表示估算值）
    metrics:
      - name: 设计洪峰
        aliases: [设计洪水, 百年一遇洪峰, 重现期洪峰]
        definition: 给定重现期 T（频率 P = 1/T）对应的洪峰流量
        formula: 用年最大值序列拟合 P-III 分布，Q_p = 均值 × (1 + Cv × Φ_p)，Φ_p 为离均系数。使用 p3_fit + p3_design_values
        notes: 年最大值序列按 USGS 水文年（10 月至次年 9 月）划分；样本只有约 20 年，外延到 100 年以上重现期不确定性很大，需在结论中说明
    glossary:
      水文年: USGS 水文年从 10 月 1 日到次年 9 月 30 日，以结束年份命名
      重现期: 平均多少年出现一次大于等于该值的事件，T = 1/P
