id: business
name: 商业 · 信息系统
description: 面向业务数据库的分析：多表关联、数据质量、销售与客户指标。
kit: proven.kit.business
datasets:
  - id: chinook
    name: Chinook 数字音乐商店
    description: 一家虚构的数字音乐零售商的业务数据库（11 张表：客户、员工、发票、发票明细、曲目、专辑、艺人、流派等），2021-2025 年。
    semantic: chinook
    source: https://github.com/lerocha/chinook-database
    license: MIT
    files:
      - business/chinook/Customer.csv
      - business/chinook/Employee.csv
      - business/chinook/Invoice.csv
      - business/chinook/InvoiceLine.csv
      - business/chinook/Track.csv
      - business/chinook/Album.csv
      - business/chinook/Artist.csv
      - business/chinook/Genre.csv
      - business/chinook/MediaType.csv
      - business/chinook/Playlist.csv
      - business/chinook/PlaylistTrack.csv
examples:
  - 2021-2025 年每年的销售额和订单数是多少？增长趋势如何？
  - 哪个国家的客户贡献的收入最多？前 5 名各占多少比例？
  - 每位销售支持代表负责的客户带来了多少收入？谁的业绩最好？
  - 检查一下这个数据库的数据质量：主键、外键是否完整？
  - 用 RFM 模型给客户分群，各群体有多少人、贡献多少收入？
